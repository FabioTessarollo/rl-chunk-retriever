device: auto               # auto | mps | cuda | cpu
seed: 1

data:
  raw_dir: data_0_raw
  extract_dir: data_1_extract
  chunk_dir: data_2_chunk_and_label
  embed_dir: data_3_embed
  cos_sim_dir: data_4_cos_sim
  analysis_dir: data_5_analysis
  models_dir: models

etl:
  chunk_size: 50
  embedding_model: intfloat/e5-base-v2

retrieval:
  cos_sim:
    threshold_range: [0.76, 0.86]
    threshold: 0.77
    top_k: 40
  reward:
    tp: 0.3333333333333333    # 1/3
    fp: -0.16666666666666666  # -1/6
    fn: -0.5

training:
  proj_dim: 512
  gamma: 0.99
  epsilon: 1.0
  epsilon_min: 0.1
  epsilon_decay: 0.99995
  batch_size: 32
  replay_capacity: 30000
  lr: 3.0e-5
  eta_min: 3.0e-6
  target_update: 4000
  epochs: 30
  max_exp_loops: 1
  action_dim: 5
  metadata_dim: 6
  dropout: 0.0
  per_alpha: 0.6
  per_beta: 0.4
  per_beta_increment: 0.001
  early_stopping_patience: 10
  early_stopping_delta: 0.001
  warm_up_epochs: 20
  neg_schedule_start: 0.30
  neg_schedule_end: 0.50
  neg_schedule_steps: 50
  weight_decay: 1.0e-4
  scheduler_t_max: 40
  train_split: 0.6

model:
  embedding_dim: 768
  path: models/rl-chunk-retriever_best.pt
