[project]
name = "rl-chunks-retriever"
version = "0.1.0"
description = "Reinforcement learning agent (Dueling DQN) for document chunk retrieval on the TREC CAR benchmark"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "cbor>=1.0.0",
    "matplotlib>=3.10.7",
    "numpy==2.3.1",
    "pandas>=2.3.3",
    "pyyaml==6.0.2",
    "scikit-learn==1.7.1",
    "sentence-transformers==5.0.0",
    "torch==2.7.1",
    "tqdm==4.67.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.12.0",
    "mlflow>=2.21.0",
]

[project.scripts]
rl-chunks = "main:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["etl", "retrieval", "config"]
